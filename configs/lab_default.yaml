lab:
  name: multi-agent-research-lab
  max_iterations: 6
  timeout_seconds: 60

agents:
  supervisor:
    model: gemini-2.5-flash-lite
    temperature: 0.0
  researcher:
    model: gemini-2.5-flash-lite
    temperature: 0.2
  analyst:
    model: gemini-2.5-flash-lite
    temperature: 0.1
  writer:
    model: gemini-2.5-flash-lite
    temperature: 0.4

benchmark:
  queries:
    - "Research GraphRAG state-of-the-art and write a 500-word summary"
    - "Compare single-agent and multi-agent workflows for customer support"
    - "Summarize production guardrails for LLM agents"

# Runtime provider configuration is loaded from .env:
# GEMINI_API_KEY=...
# GEMINI_MODEL=gemini-2.5-flash-lite
